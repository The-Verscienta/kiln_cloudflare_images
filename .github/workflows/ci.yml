name: CI

# This plugin is a Mix project that depends only on `kiln_plugin` (the plugin
# contract, kiln_cms#1909), so it is checked twice:
#
#   * standalone — compile, format and the unit tests in test/, against the
#     SDK from Hex and nothing else. This is what a site's `mix deps.get`
#     compiles.
#   * in-kiln — inside a kiln_cms checkout, installed the way a site installs
#     it: one line in the git-ignored `config/project_deps.exs`
#     (kiln_cms#1967). Runs test_kiln/, the tests that need the core (upload
#     ingest, variants, adoption, the backend registry and plugin doctor).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      kiln_ref:
        description: kiln_cms ref to test against
        required: false

env:
  # The kiln_cms release the in-kiln job runs against: the oldest the README
  # supports. 1.4.0 is the first with the `config/project_deps.exs` hook
  # (kiln_cms#1979) and `Kiln.ImageBackend.check/0` (kiln_cms#1980). Move it
  # when the plugin starts needing a later release; `kiln_ref` on a manual run
  # tests against any other ref, `main` included.
  KILN_REF: ${{ inputs.kiln_ref || 'v1.4.0' }}
  MIX_ENV: test

jobs:
  standalone:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # The same Elixir/OTP pair as kiln_cms's .tool-versions.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4-otp-29"
          otp-version: "29.1.1"
          version-type: strict

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-standalone-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-standalone-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  in-kiln:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out kiln_cms
        uses: actions/checkout@v5
        with:
          repository: The-Verscienta/kiln_cms
          ref: ${{ env.KILN_REF }}

      - name: Check out this plugin beside it
        uses: actions/checkout@v5
        with:
          path: plugins/kiln_cloudflare_images

      # As a site does: the overlay's dependency list, never kiln_cms's mix.exs.
      # Written before setup-mix so its `deps.get` and compile include the plugin.
      - name: Install the plugin through config/project_deps.exs
        run: |
          echo '[{:kiln_cloudflare_images, path: "plugins/kiln_cloudflare_images"}]' > config/project_deps.exs

      - name: Set up Mix (kiln_cms's own action)
        uses: ./.github/actions/setup-mix
        with:
          compile: warnings-as-errors

      - name: Kiln's lock and tree are untouched
        run: |
          git diff --exit-code mix.lock
          # plugins/ is this repo's own checkout; everything else must be clean.
          test -z "$(git status --porcelain -- . ':!plugins')"

      - name: Test inside Kiln
        run: mix test plugins/kiln_cloudflare_images/test_kiln
